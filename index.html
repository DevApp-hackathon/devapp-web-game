<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DevOps Startup</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }

    #planning-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }
    #planning-overlay.active { display: flex; }

    #planning-panel {
      background: #12122a;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      padding: 24px;
      width: 740px;
      max-height: 95vh;
      position: relative;
    }

    #planning-title {
      color: #00d4ff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 6px;
    }
    #planning-subtitle {
      color: #666688;
      font-size: 7px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #planning-columns {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
    }

    .col-title {
      font-size: 8px;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    #col-tasks .col-title  { color: #aaaaaa; background: #1a1a3e; border: 1px solid #333366; }
    #col-plan  .col-title  { color: #aaaaaa; background: #1a2e1a; border: 1px solid #336633; }

    #col-tasks, #col-plan { flex: 1; }

    #col-plan .slot {
      min-height: 54px;
      border: 1px dashed #333355;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0d0d20;
      transition: border-color 0.2s, background 0.2s;
    }
    #col-plan .slot.drag-over {
      border-color: #00d4ff;
      background: #1a1a3e;
    }
    #col-plan .slot .slot-num {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #333355;
      font-size: 8px;
    }

    .task-card {
      min-height: 50px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 8px;
      color: #fff;
      cursor: grab;
      padding: 6px 10px;
      line-height: 1.7;
      border: 2px solid rgba(255,255,255,0.2);
      user-select: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .task-card:active { cursor: grabbing; transform: scale(1.04); }
    .task-card.dragging { opacity: 0.4; }

    #planning-check {
      display: block;
      width: 100%;
      padding: 12px;
      background: #00d4ff;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #0d0d1f;
      cursor: pointer;
      margin-top: 4px;
    }
    #planning-check:hover { background: #0099bb; }

    #planning-message {
      font-size: 8px;
      text-align: center;
      margin-top: 10px;
      min-height: 20px;
      line-height: 1.6;
    }

    /* Экран результата внутри оверлея */
    #planning-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #planning-result.active { display: flex; }
    #planning-result .result-title { font-size: 22px; text-align: center; }
    #planning-result .result-list { width: 100%; }
    #planning-result .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 8px;
    }
    #planning-result .result-row.ok    { background: #0a1a0a; border: 1px solid #00aa44; color: #88ff88; }
    #planning-result .result-row.error { background: #1f0808; border: 1px solid #ff4444; color: #ff8888; }
    #planning-result .row-num { color: #666; min-width: 20px; }
    #planning-result .row-err { margin-left: auto; color: #ff4444; font-size: 7px; }

    #planning-close {
      position: absolute;
      top: 12px; right: 16px;
      background: none;
      border: none;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      line-height: 1;
    }
    #planning-close:hover { color: #ff4444; }

    #planning-retry {
      padding: 10px 24px;
      background: #ff4444;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #fff;
      cursor: pointer;
    }
    #planning-retry:hover { background: #cc2222; }

    #planning-go {
      padding: 10px 24px;
      background: #00ff88;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #0d1f0d;
      cursor: pointer;
    }
    #planning-go:hover { background: #00cc66; }
  </style>
  <script type="module" crossorigin src="/devapp-web-game/assets/index-BQNJv8ou.js"></script>
</head>
<body>
  <!-- Шпаргалка с планом -->
  <div id="cheatsheet-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; font-family:'Press Start 2P',monospace;">
    <div style="background:#0a1a0a; border:2px solid #00aa44; border-radius:8px; padding:28px; width:560px; position:relative;">
      <button onclick="document.getElementById('cheatsheet-overlay').style.display='none'; window.dispatchEvent(new Event('cheatsheet-closed'))"
        style="position:absolute;top:12px;right:16px;background:none;border:none;color:#666;font-size:18px;cursor:pointer;font-family:inherit;">✕</button>
      <div style="color:#00ff88; font-size:13px; text-align:center; margin-bottom:16px;">МОЙ ПЛАН</div>
      <div style="color:#666688; font-size:7px; text-align:center; margin-bottom:18px;">Опирайся на этот порядок при прохождении</div>
      <div style="font-size:8px; color:#aaffaa; line-height:2.2;">
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">1. Настроить CI/CD</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">2. Написать автотесты</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">3. Автоматизировать сборку</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">4. Настроить логирование</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">5. Подключить мониторинг</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">6. Выстроить процесс релиза</div>
        <div style="padding:7px 12px; margin-bottom:6px; background:#111f11; border:1px solid #1a8c55; border-radius:5px;">7. Финальный деплой</div>
      </div>
    </div>
  </div>

  <div id="planning-overlay">
    <div id="planning-panel">
      <button id="planning-close">✕</button>

      <!-- Основной вид -->
      <div id="planning-main">
        <div id="planning-title">ПЛАНИРОВАНИЕ ДНЯ</div>
        <div id="planning-subtitle">Расставь задачи в правильном порядке выполнения</div>
        <div id="planning-columns">
          <div id="col-tasks">
            <div class="col-title">ЗАДАЧИ</div>
            <!-- карточки генерируются в JS -->
          </div>
          <div id="col-plan">
            <div class="col-title">МОЙ ПЛАН</div>
            <!-- слоты генерируются в JS -->
          </div>
        </div>
        <button id="planning-check">ПРОВЕРИТЬ</button>
        <div id="planning-message"></div>
      </div>

      <!-- Экран результата -->
      <div id="planning-result">
        <div class="result-title" id="result-title"></div>
        <div class="result-list" id="result-list"></div>
        <div style="display:flex;gap:16px;">
          <button id="planning-retry">ПОПРОБОВАТЬ ЕЩЁ</button>
          <button id="planning-go">В РАБОТУ! →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quest overlay (laptop) -->
  <div id="quest-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;justify-content:center;align-items:center;font-family:'Press Start 2P',monospace;">
    <div id="quest-panel" style="background:#12122a;border:2px solid #00d4ff;border-radius:8px;padding:28px;width:680px;max-height:90vh;overflow-y:auto;position:relative;">
      <button id="quest-close" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#666;font-size:18px;cursor:pointer;font-family:inherit;">✕</button>
      <div id="quest-intro"></div>
      <div id="quest-choice" style="display:none;"></div>
      <div id="quest-mg" style="display:none;"></div>
      <div id="mg-manual" style="display:none;"></div>
      <div id="mg-cicd" style="display:none;"></div>
      <div id="mg-delay" style="display:none;"></div>
    </div>
  </div>

  <script src="/src/planning.js"></script>
  <script src="/src/quest-laptop.js"></script>
  <script src="/src/quest-engine.js"></script>
</body>
</html>
