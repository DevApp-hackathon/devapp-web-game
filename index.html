<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DevOps Startup</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }

    /* ✅ ОБЩИЙ overlay */
    #quest-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }
    #quest-overlay.active {
      display: flex;
    }

    #planning-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }
    #planning-overlay.active { display: flex; }

    #planning-panel {
      background: #12122a;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      padding: 24px;
      width: 740px;
      max-height: 95vh;
      position: relative;
    }

    #planning-title {
      color: #00d4ff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 6px;
    }

    #planning-subtitle {
      color: #666688;
      font-size: 7px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #planning-columns {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
    }

    .col-title {
      font-size: 8px;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    #col-tasks .col-title  { color: #aaaaaa; background: #1a1a3e; border: 1px solid #333366; }
    #col-plan  .col-title  { color: #aaaaaa; background: #1a2e1a; border: 1px solid #336633; }

    #col-tasks, #col-plan { flex: 1; }

    #col-plan .slot {
      min-height: 54px;
      border: 1px dashed #333355;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0d0d20;
    }

    .task-card {
      min-height: 50px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 8px;
      color: #fff;
      cursor: grab;
      padding: 6px 10px;
      border: 2px solid rgba(255,255,255,0.2);
    }

    #planning-check {
      width: 100%;
      padding: 12px;
      background: #00d4ff;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
    }

    /* QUEST PANEL */
    #quest-panel {
      background:#12122a;
      border:2px solid #00d4ff;
      border-radius:8px;
      padding:28px;
      width:680px;
      max-height:90vh;
      overflow-y:auto;
      position:relative;
    }
  </style>
  <script type="module" crossorigin src="/devapp-web-game/assets/index-BXV7X-xT.js"></script>
</head>

<body>

  <!-- QUEST overlay -->
  <div id="quest-overlay">
    <div id="quest-panel">
      <button id="quest-close" type="button"
        style="position:absolute;top:12px;right:16px;background:none;border:none;color:#666;font-size:18px;cursor:pointer;font-family:inherit;">✕</button>

      <div id="quest-intro"></div>
      <div id="quest-choice" style="display:none;"></div>
      <div id="quest-mg" style="display:none;"></div>
      <div id="mg-manual" style="display:none;"></div>
      <div id="mg-cicd" style="display:none;"></div>
      <div id="mg-delay" style="display:none;"></div>
    </div>
  </div>

  <!-- planning overlay -->
  <div id="planning-overlay">
    <div id="planning-panel">
      <button id="planning-close" type="button">✕</button>
      <div id="planning-title">ПЛАНИРОВАНИЕ ДНЯ</div>
      <div id="planning-subtitle">Расставь задачи в правильном порядке выполнения</div>
      <button id="planning-check" type="button">ПРОВЕРИТЬ</button>
    </div>
  </div>

  <script src="/src/quest-engine.js"></script>
  <script src="/src/planning.js"></script>
  <script src="/src/quest-laptop.js"></script>

</body>
</html>
