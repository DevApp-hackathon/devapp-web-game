<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>DevOps Startup</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* QUEST overlay */
    #quest-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }

    #quest-panel {
      background:#12122a;
      border:2px solid #00d4ff;
      border-radius:8px;
      padding:28px;
      width:680px;
      max-height:90vh;
      overflow-y:auto;
      position:relative;
    }

    /* planning overlay */
    #planning-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }

    #planning-panel {
      background: #12122a;
      border: 2px solid #00d4ff;
      border-radius: 8px;
      padding: 24px;
      width: 740px;
    }

    #planning-title {
      color: #00d4ff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 6px;
    }

    #planning-subtitle {
      color: #666688;
      font-size: 7px;
      text-align: center;
      margin-bottom: 20px;
    }

    #planning-check {
      width: 100%;
      padding: 12px;
      background: #00d4ff;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- QUEST -->
  <div id="quest-overlay">
    <div id="quest-panel">
      <button id="quest-close"
        style="position:absolute;top:12px;right:16px;background:none;border:none;color:#666;font-size:18px;cursor:pointer;">
        ✕
      </button>

      <div id="quest-intro"></div>
      <div id="quest-choice" style="display:none;"></div>
      <div id="mg-manual" style="display:none;"></div>
      <div id="mg-cicd" style="display:none;"></div>
      <div id="mg-delay" style="display:none;"></div>
    </div>
  </div>

  <!-- PLANNING -->
  <div id="planning-overlay">
    <div id="planning-panel">
      <button id="planning-close">✕</button>
      <div id="planning-title">ПЛАНИРОВАНИЕ ДНЯ</div>
      <div id="planning-subtitle">Расставь задачи в правильном порядке</div>
      <button id="planning-check">ПРОВЕРИТЬ</button>
    </div>
  </div>

  <!-- ✅ ВАЖНО: только main.js как module -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
